[tools]
rust = "stable"
prek = "latest"
node = "lts"
# vp(Vite+ global CLI)は curl install:
#   curl -fsSL https://vite.plus | bash
# ~/.vite-plus/bin/vp に入る。mise 管理外なので PATH を通す。
# vite-plus(per-project ライブラリ)は web/devDeps で、`vp create`/`vp install` が入れる。

[env]
_.path = ["~/.vite-plus/bin"]

# ------------------------------------------------------------------------------
# Format / lint / test / CI
# ------------------------------------------------------------------------------

[tasks.fmt]
description = "Format Rust sources"
run = "cargo fmt --all"

[tasks."fmt:check"]
description = "Check formatting (fails on diff)"
run = "cargo fmt --all -- --check"

[tasks.clippy]
description = "Run clippy with -D warnings on all targets"
run = "cargo clippy --all-targets -- -D warnings"

[tasks.test]
description = "Run Rust tests (lib + integration + examples)"
run = "cargo test --all-targets --no-fail-fast"

[tasks.doc]
description = "Build API documentation (no deps)"
run = "cargo doc --no-deps"

[tasks.ci]
description = "GitHub Actions CI と同じ一式(Rust + web)"
depends = ["fmt:check", "clippy", "test", "web:check"]

[tasks.hooks]
description = "prek hooks (commit + pre-push) を install"
run = ["prek install", "prek install --hook-type pre-push"]

# ------------------------------------------------------------------------------
# Local dev
# ------------------------------------------------------------------------------

[tasks.dev]
description = "Rust server を DEV_MODE で起動。別途 `mise run web:dev` で Vite dev も上げる前提"
run = "NAPO_DEV_MODE=true NAPO_DB=./napo.db cargo run"

[tasks."dev:integrated"]
description = "Web を build → Rust が NAPO_STATIC=./static/dist で配信(本番に近い形)"
depends = ["web:build"]
run = "NAPO_DEV_MODE=true NAPO_DB=./napo.db NAPO_STATIC=./static/dist cargo run"

# ------------------------------------------------------------------------------
# Web (Vite+ + React) は web/ で実行
# ------------------------------------------------------------------------------

[tasks."web:dev"]
description = "Vite dev server (localhost:5173 → /api・/ws を Rust:8080 へ proxy)"
dir = "web"
run = "vp dev"

[tasks."web:build"]
description = "Production build → ../static/dist"
dir = "web"
run = "vp build"

[tasks."web:check"]
description = "fmt + lint + tsc(format は自動修正)"
dir = "web"
run = "vp check --fix"

[tasks."web:lint"]
description = "Lint (Oxlint, type-aware)"
dir = "web"
run = "vp lint"

[tasks."web:fmt"]
description = "Format (Oxfmt)"
dir = "web"
run = "vp fmt"

[tasks."web:test"]
description = "Vitest"
dir = "web"
run = "vp test"

[tasks."web:types"]
description = "src/protocol.rs から TS 型を web/src/types/ に再生成"
run = "cargo test --lib export_bindings --quiet"

[tasks."web:e2e"]
description = "Playwright で 5 player E2E。webServer 機能で Rust server を自動起動"
dir = "web"
run = "pnpm exec playwright test"

[tasks."web:e2e:ui"]
description = "Playwright UI mode(対話デバッグ)"
dir = "web"
run = "pnpm exec playwright test --ui"

# ------------------------------------------------------------------------------
# Release build(musl static-pie)
# ------------------------------------------------------------------------------

[tasks."build:release"]
description = "musl static-pie を cross (Docker) でビルド"
run = "cross build --release --target x86_64-unknown-linux-musl"

[tasks."build:release-native"]
description = "musl-cross をローカルに入れている場合の直 build(macOS では非推奨)"
run = "cargo build --release --target x86_64-unknown-linux-musl"

# ------------------------------------------------------------------------------
# Deploy(HOST=user@host PORT=22 mise run deploy で上書き可)
# ------------------------------------------------------------------------------

[tasks.deploy]
description = "フルデプロイ: web build + binary cross-build + 両方転送 + restart"
depends = ["deploy:web", "build:release"]
run = '''
HOST="${HOST:-ubuntu@napo.example.com}"
PORT="${PORT:-22}"
TARGET="x86_64-unknown-linux-musl"
scp -P "$PORT" "target/$TARGET/release/napo-online" "$HOST:/tmp/"
ssh -p "$PORT" "$HOST" '
  sudo install -m 755 -o napo -g napo \
      /tmp/napo-online /opt/napo/napo-online.new && \
  sudo mv -f /opt/napo/napo-online /opt/napo/napo-online.prev 2>/dev/null || true && \
  sudo mv /opt/napo/napo-online.new /opt/napo/napo-online && \
  sudo systemctl restart napo
'
'''

[tasks."deploy:bin"]
description = "binary だけ転送(web 変更なし時)"
depends = ["build:release"]
run = '''
HOST="${HOST:-ubuntu@napo.example.com}"
PORT="${PORT:-22}"
TARGET="x86_64-unknown-linux-musl"
scp -P "$PORT" "target/$TARGET/release/napo-online" "$HOST:/tmp/"
ssh -p "$PORT" "$HOST" '
  sudo install -m 755 -o napo -g napo \
      /tmp/napo-online /opt/napo/napo-online.new && \
  sudo mv -f /opt/napo/napo-online /opt/napo/napo-online.prev 2>/dev/null || true && \
  sudo mv /opt/napo/napo-online.new /opt/napo/napo-online && \
  sudo systemctl restart napo
'
'''

[tasks."deploy:web"]
description = "Web bundle のみ本番に転送 (/opt/napo/dist/)"
depends = ["web:build"]
run = '''
HOST="${HOST:-ubuntu@napo.example.com}"
PORT="${PORT:-22}"
rsync -avz --delete -e "ssh -p $PORT" static/dist/ "$HOST:/tmp/napo-dist/"
ssh -p "$PORT" "$HOST" '
  sudo rm -rf /opt/napo/dist && \
  sudo mv /tmp/napo-dist /opt/napo/dist && \
  sudo chown -R napo:napo /opt/napo/dist
'
'''

[tasks."deploy:rollback"]
description = ".prev に戻す(バイナリのみ。web は別途巻き戻し)"
run = '''
HOST="${HOST:-ubuntu@napo.example.com}"
PORT="${PORT:-22}"
ssh -p "$PORT" "$HOST" '
  sudo mv /opt/napo/napo-online /opt/napo/napo-online.broken && \
  sudo mv /opt/napo/napo-online.prev /opt/napo/napo-online && \
  sudo systemctl restart napo
'
'''

# ------------------------------------------------------------------------------
# Ops
# ------------------------------------------------------------------------------

[tasks.logs]
description = "本番 journalctl を tail"
run = '''
HOST="${HOST:-ubuntu@napo.example.com}"
PORT="${PORT:-22}"
ssh -p "$PORT" "$HOST" 'sudo journalctl -u napo -f'
'''

[tasks.health]
description = "/healthz への疎通確認。`URL=https://... mise run health` で上書き可"
run = "curl -sS -o /dev/null -w 'HTTP %{http_code}\\n' \"${URL:-https://napo.example.com/healthz}\""

[tasks."db:pull"]
description = "本番 game.db を ./game.prod.db に scp"
run = '''
HOST="${HOST:-ubuntu@napo.example.com}"
PORT="${PORT:-22}"
scp -P "$PORT" "$HOST:/var/lib/napo/game.db" ./game.prod.db
echo "downloaded ./game.prod.db"
'''
