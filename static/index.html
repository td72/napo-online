<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>napo-online</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        max-width: 900px;
        margin: 1rem auto;
        padding: 0 1rem;
        background: #1a1a1a;
        color: #e8e8e8;
      }
      h1, h2 { margin: 0.5em 0 0.25em; }
      h1 { font-size: 1.4rem; }
      h2 { font-size: 1.1rem; color: #9cf; }
      .panel {
        background: #2a2a2a;
        border: 1px solid #3a3a3a;
        border-radius: 6px;
        padding: 0.75rem 1rem;
        margin-bottom: 0.75rem;
      }
      .game-row {
        border-top: 1px solid #333;
        padding: 0.4rem 0;
      }
      .game-row:first-child { border-top: none; }
      .game-meta { color: #aaa; }
      .win { color: #6c6; }
      .lose { color: #c66; }
      .seat-pill {
        display: inline-block;
        padding: 0 0.4rem;
        margin-right: 0.3rem;
        background: #333;
        border-radius: 3px;
      }
      .seat-pill.declarer { background: #553; }
      .seat-pill.adjutant { background: #535; }
      .seat-pill .pos { color: #6c6; }
      .seat-pill .neg { color: #c66; }
      input, select, button {
        font-size: 1rem;
        padding: 0.4rem 0.6rem;
        background: #1a1a1a;
        color: #e8e8e8;
        border: 1px solid #4a4a4a;
        border-radius: 4px;
      }
      button {
        cursor: pointer;
        background: #3a5;
        border-color: #4a6;
        margin: 0.15rem;
      }
      button:hover:not(:disabled) { background: #4a6; }
      button:disabled { opacity: 0.4; cursor: not-allowed; }
      button.danger { background: #a44; border-color: #b55; }
      button.card {
        font-family: monospace;
        font-size: 1.05rem;
        min-width: 3rem;
      }
      button.card.suit-S, button.card.suit-C { color: #fff; background: #333; border-color: #555; }
      button.card.suit-H, button.card.suit-D { color: #fbb; background: #422; border-color: #622; }
      button.card.selected { outline: 2px solid #fc6; outline-offset: 1px; }
      .row { display: flex; gap: 0.4rem; align-items: center; flex-wrap: wrap; }
      .seat {
        display: inline-block;
        padding: 0.25rem 0.6rem;
        border-radius: 4px;
        background: #3a3a3a;
        margin: 0.15rem;
        font-size: 0.9rem;
      }
      .seat.you { background: #3a5; color: #fff; }
      .seat.host::before { content: "👑 "; }
      .seat.offline { opacity: 0.5; text-decoration: line-through; }
      .seat.to-act { outline: 2px solid #fc6; }
      #log {
        font-family: monospace;
        font-size: 0.8rem;
        max-height: 12rem;
        overflow-y: auto;
        background: #111;
        padding: 0.5rem;
        border-radius: 4px;
        white-space: pre-wrap;
      }
      .err { color: #f88; }
      .info { color: #9cf; }
      .small { font-size: 0.85rem; color: #aaa; }
      .hidden { display: none; }
    </style>
  </head>
  <body>
    <h1>🎴 napo-online</h1>

    <div id="login" class="panel">
      <h2>ログイン</h2>
      <div class="row">
        <input id="name" placeholder="表示名" autocomplete="off" />
        <input id="dev_email" placeholder="dev_email (DEV_MODE のみ)" />
        <button id="connect">接続</button>
      </div>
      <p class="small">本番では Cloudflare Access の Cookie 認証で自動ログインします。
        ローカル DEV_MODE では <code>dev_email</code> で別 identity を区別。</p>
    </div>

    <div id="profile" class="panel hidden">
      <h2>プロフィール</h2>
      <p class="small">email: <span id="my_email">—</span></p>
      <div class="row">
        <span class="small">表示名:</span>
        <input id="profile_handle" />
        <button id="save_handle">変更</button>
        <span id="handle_status" class="small"></span>
      </div>
    </div>

    <div id="users_panel" class="panel hidden">
      <div class="row">
        <h2 style="margin: 0; flex: 1">登録ユーザ <span id="users_count" class="small"></span></h2>
        <button id="refresh_users">↻ 更新</button>
      </div>
      <div id="users_list" class="small"></div>
      <div class="row">
        <button id="more_users" class="hidden">もっと見る</button>
      </div>
      <p class="small" style="color: #777">
        ※ 招待リスト本体は Cloudflare Access dashboard に。ここは「一度でも接続したユーザ」だけ
      </p>
    </div>

    <div id="stats_panel" class="panel hidden">
      <div class="row">
        <h2 style="margin: 0; flex: 1">成績</h2>
        <button id="refresh_stats">↻ 更新</button>
      </div>
      <table id="stats_table" class="small" style="width: 100%; border-collapse: collapse;">
        <thead>
          <tr style="text-align: left; color: #9cf;">
            <th>順</th>
            <th>プレイヤー</th>
            <th>局</th>
            <th>累積</th>
            <th>ナポ</th>
            <th>副官</th>
            <th>連合</th>
          </tr>
        </thead>
        <tbody id="stats_body"></tbody>
      </table>
    </div>

    <div id="games_panel" class="panel hidden">
      <div class="row">
        <h2 style="margin: 0; flex: 1">最近の対戦 <span id="games_count" class="small"></span></h2>
        <button id="refresh_games">↻ 更新</button>
      </div>
      <div id="games_list" class="small"></div>
      <div class="row">
        <button id="more_games" class="hidden">もっと見る</button>
      </div>
    </div>

    <div id="lobby" class="panel hidden">
      <h2>ロビー</h2>
      <div class="row">
        <button id="create">部屋を作る</button>
        <input id="room_id_input" placeholder="部屋ID" />
        <button id="join">入室</button>
        <span class="small">部屋IDは8文字英数字</span>
      </div>
    </div>

    <div id="room" class="panel hidden">
      <h2>部屋 <span id="room_id_display"></span></h2>
      <div id="seats"></div>
      <div class="row">
        <button id="start_match">セット開始(5人で開始)</button>
        <button id="leave_room" class="danger">退室</button>
        <button id="abort_hand" class="danger hidden">局中断 (T3 経過後)</button>
        <button id="end_match" class="danger hidden">セット終了 (T4 経過後)</button>
      </div>
    </div>

    <div id="game" class="panel hidden">
      <h2>進行: <span id="phase_label">—</span></h2>
      <div id="hand_area"></div>
      <div id="action_area"></div>
      <div id="trick_area" class="small"></div>
      <div id="scores" class="small"></div>
      <div class="row">
        <button id="next_hand" class="hidden">次の局へ</button>
      </div>
    </div>

    <div class="panel">
      <h2>ログ</h2>
      <div id="log"></div>
    </div>

    <script>
      // ---------- DOM helpers ----------
      const $ = (id) => document.getElementById(id);
      const log = (msg, cls = "") => {
        const el = document.createElement("div");
        if (cls) el.className = cls;
        el.textContent = `${new Date().toLocaleTimeString()}  ${msg}`;
        $("log").prepend(el);
      };

      const SUITS = ["S", "H", "D", "C"];
      const TRUMPS = [...SUITS, "NT"];
      const RANKS = ["A", "K", "Q", "J", "10", "9", "8", "7", "6", "5", "4", "3", "2"];
      const FULL_DECK = SUITS.flatMap((s) => RANKS.map((r) => s + r));
      const SUIT_GLYPH = { S: "♠", H: "♥", D: "♦", C: "♣", NT: "NT" };
      const cardLabel = (c) => SUIT_GLYPH[c[0]] + c.slice(1);

      // ---------- WebSocket ----------
      let ws = null;
      let myEmail = null;
      let myDisplayName = null;
      let currentRoom = null;
      let isHost = false;
      let mySeat = null;
      let lastObs = null;
      let phase = "lobby"; // lobby | playing | between_hands | ended
      let seats = []; // [{ seat, player_id, display_name }]
      let suspendedSeats = new Set();

      function connect() {
        myDisplayName = $("name").value.trim() || "anonymous";
        const devEmail = $("dev_email").value.trim();
        const url = new URL("/ws", location.origin);
        url.protocol = url.protocol === "https:" ? "wss:" : "ws:";
        if (devEmail) url.searchParams.set("dev_email", devEmail);

        ws = new WebSocket(url.toString());
        ws.onopen = () => {
          log("WebSocket 接続", "info");
          send({ type: "hello", payload: { display_name: myDisplayName } });
          $("login").classList.add("hidden");
          $("profile").classList.remove("hidden");
          $("users_panel").classList.remove("hidden");
          $("stats_panel").classList.remove("hidden");
          $("games_panel").classList.remove("hidden");
          $("lobby").classList.remove("hidden");
          fetchMe();
          fetchUsers();
          fetchStats();
          fetchGames();
        };
        ws.onmessage = (ev) => handleMessage(JSON.parse(ev.data));
        ws.onclose = () => log("WebSocket 切断", "err");
        ws.onerror = (e) => log("WebSocket エラー: " + e, "err");
      }

      async function fetchMe() {
        try {
          const r = await fetch("/api/me");
          if (!r.ok) return;
          const me = await r.json();
          $("my_email").textContent = me.email;
          $("profile_handle").value = me.handle || myDisplayName;
        } catch (e) {
          log("fetchMe failed: " + e, "err");
        }
      }

      const PAGE_SIZE = 10;
      let usersOffset = 0;
      let gamesOffset = 0;

      async function fetchUsers(append = false) {
        try {
          if (!append) usersOffset = 0;
          const r = await fetch(`/api/users?limit=${PAGE_SIZE}&offset=${usersOffset}`);
          if (!r.ok) return;
          const data = await r.json();
          const ul = $("users_list");
          if (!append) ul.innerHTML = "";
          for (const u of data.items) {
            const div = document.createElement("div");
            const t = new Date(u.last_seen * 1000).toLocaleString();
            div.textContent = `${u.handle}  (${u.email})  最終: ${t}`;
            ul.appendChild(div);
          }
          if (!append && data.items.length === 0) {
            ul.textContent = "(まだ誰もログインしていません)";
          }
          usersOffset += data.items.length;
          $("more_users").classList.toggle("hidden", !data.has_more);
          $("users_count").textContent = `${usersOffset} / ${data.total}`;
        } catch (e) {
          log("fetchUsers failed: " + e, "err");
        }
      }

      async function fetchStats() {
        try {
          const r = await fetch("/api/stats");
          if (!r.ok) return;
          const stats = await r.json();
          const body = $("stats_body");
          body.innerHTML = "";
          stats.forEach((s, idx) => {
            const tr = document.createElement("tr");
            tr.style.borderTop = "1px solid #333";
            const totalClass = s.total_score > 0 ? "win" : s.total_score < 0 ? "lose" : "";
            const napRate = s.as_napoleon.count > 0
              ? ` (${Math.round((s.as_napoleon.wins / s.as_napoleon.count) * 100)}%)`
              : "";
            const adjRate = s.as_adjutant.count > 0
              ? ` (${Math.round((s.as_adjutant.wins / s.as_adjutant.count) * 100)}%)`
              : "";
            const allyRate = s.as_ally.count > 0
              ? ` (${Math.round((s.as_ally.wins / s.as_ally.count) * 100)}%)`
              : "";
            tr.innerHTML = `
              <td>${idx + 1}</td>
              <td><b>${escapeHtml(s.handle)}</b></td>
              <td>${s.played}</td>
              <td><span class="${totalClass}">${s.total_score >= 0 ? "+" : ""}${s.total_score}</span></td>
              <td>${s.as_napoleon.wins}/${s.as_napoleon.count}${napRate}</td>
              <td>${s.as_adjutant.wins}/${s.as_adjutant.count}${adjRate}</td>
              <td>${s.as_ally.wins}/${s.as_ally.count}${allyRate}</td>
            `;
            body.appendChild(tr);
          });
          if (stats.length === 0) {
            body.innerHTML = `<tr><td colspan="7" style="color: #777">(まだ集計対象の局がありません)</td></tr>`;
          }
        } catch (e) {
          log("fetchStats failed: " + e, "err");
        }
      }

      async function fetchGames(append = false) {
        try {
          if (!append) gamesOffset = 0;
          const r = await fetch(`/api/games?limit=${PAGE_SIZE}&offset=${gamesOffset}`);
          if (!r.ok) return;
          const data = await r.json();
          const list = $("games_list");
          if (!append) list.innerHTML = "";
          for (const g of data.items) {
            list.appendChild(renderGameRow(g));
          }
          if (!append && data.items.length === 0) {
            list.textContent = "(対戦履歴なし)";
          }
          gamesOffset += data.items.length;
          $("more_games").classList.toggle("hidden", !data.has_more);
          $("games_count").textContent = `${gamesOffset} / ${data.total}`;
        } catch (e) {
          log("fetchGames failed: " + e, "err");
        }
      }

      function renderGameRow(g) {
        const div = document.createElement("div");
        div.className = "game-row";
        const t = new Date(g.ended_at * 1000).toLocaleString();
        const napName = g.napoleon ? (g.napoleon.handle || g.napoleon.email) : "?";
        const adjName = g.adjutant ? (g.adjutant.handle || g.adjutant.email) : "(なし/一人立ち)";
        const trump = g.bid_suit ? (SUIT_GLYPH[g.bid_suit] || g.bid_suit) : "?";
        const bidStr = `${g.bid_value || "?"}${trump}`;
        const result = g.napoleon_won === null
          ? ""
          : g.napoleon_won
            ? `<span class="win">ナポ勝ち</span>`
            : `<span class="lose">ナポ負け</span>`;

        const meta = document.createElement("div");
        meta.className = "game-meta";
        meta.innerHTML = `<span style="color: #ccc">${t}</span>  部屋 ${g.room_id}  ${result}`;
        div.appendChild(meta);

        const main = document.createElement("div");
        main.innerHTML = `ナポ <b>${escapeHtml(napName)}</b> + 副官 <b>${escapeHtml(adjName)}</b>  宣言 <b>${bidStr}</b>`;
        div.appendChild(main);

        const seats = document.createElement("div");
        seats.style.marginTop = "0.2rem";
        for (const p of g.players) {
          const pill = document.createElement("span");
          pill.className = "seat-pill";
          if (g.napoleon && p.email === g.napoleon.email) pill.classList.add("declarer");
          if (g.adjutant && p.email === g.adjutant.email) pill.classList.add("adjutant");
          const scoreClass = (p.score ?? 0) > 0 ? "pos" : (p.score ?? 0) < 0 ? "neg" : "";
          pill.innerHTML = `${p.seat}: ${escapeHtml(p.handle || p.email)} <span class="${scoreClass}">${p.score >= 0 ? "+" : ""}${p.score}</span>`;
          seats.appendChild(pill);
        }
        div.appendChild(seats);
        return div;
      }

      function escapeHtml(s) {
        return String(s)
          .replace(/&/g, "&amp;")
          .replace(/</g, "&lt;")
          .replace(/>/g, "&gt;")
          .replace(/"/g, "&quot;");
      }

      function send(msg) {
        ws.send(JSON.stringify(msg));
      }

      function handleMessage(m) {
        switch (m.type) {
          case "welcome":
            myEmail = m.payload.player_id;
            log(`Welcome: ${myEmail}`, "info");
            break;
          case "room_state":
            renderRoom(m.payload.state);
            break;
          case "match_started":
            seats = m.payload.seats;
            mySeat = seats.find((s) => s.player_id === myEmail)?.seat ?? null;
            phase = "playing";
            $("room").classList.add("hidden");
            $("game").classList.remove("hidden");
            log(`セット開始 (seed=${m.payload.match_seed}, あなたは seat ${mySeat})`, "info");
            break;
          case "observation":
            lastObs = m.payload.observation;
            renderGame();
            break;
          case "event":
            renderEvent(m.payload.event);
            break;
          case "hand_ended":
            log(`局終了 scores=${JSON.stringify(m.payload.scores)} cumulative=${JSON.stringify(m.payload.cumulative)}`, "info");
            phase = "between_hands";
            $("next_hand").classList.remove("hidden");
            $("scores").textContent = `累積: ${JSON.stringify(m.payload.cumulative)}`;
            // DB に永続化されたはずなので履歴と成績を更新
            fetchGames();
            fetchStats();
            break;
          case "next_hand_ready":
            log(`Next 投票: ${m.payload.ready_seats.join(",")}`);
            break;
          case "match_ended":
            log(`セット終了 final=${JSON.stringify(m.payload.final_scores)}`, "info");
            phase = "ended";
            $("scores").textContent = `最終: ${JSON.stringify(m.payload.final_scores)}`;
            $("next_hand").classList.add("hidden");
            break;
          case "player_disconnected":
            suspendedSeats.add(m.payload.seat);
            log(`seat ${m.payload.seat} 切断中 (${m.payload.since_ms}ms)`, "err");
            // RoomState は別途 broadcast されないので seats を再描画
            break;
          case "player_reconnected":
            suspendedSeats.delete(m.payload.seat);
            log(`seat ${m.payload.seat} 復帰`, "info");
            break;
          case "error":
            log(`Error[${m.payload.code}]: ${m.payload.message}`, "err");
            break;
          case "pong":
            break;
          default:
            log(`未知メッセージ: ${m.type}`);
        }
      }

      // ---------- Lobby ----------
      function renderRoom(state) {
        currentRoom = state.room_id;
        isHost = state.host === myEmail;
        $("room_id_display").textContent = state.room_id;
        $("room").classList.remove("hidden");

        const seatsDiv = $("seats");
        seatsDiv.innerHTML = "";
        for (const p of state.players) {
          const el = document.createElement("span");
          el.className = "seat";
          if (p.player_id === myEmail) el.classList.add("you");
          if (p.player_id === state.host) el.classList.add("host");
          if (!p.online) el.classList.add("offline");
          const seatLabel = p.seat !== null ? `[${p.seat}] ` : "";
          el.textContent = `${seatLabel}${p.display_name}`;
          seatsDiv.appendChild(el);
        }

        $("start_match").disabled = !(isHost && state.players.length === 5 && state.state.type === "lobby");
        $("abort_hand").classList.toggle("hidden", !isHost);
        $("end_match").classList.toggle("hidden", !isHost);

        if (state.state.type === "ended") {
          phase = "ended";
        }
      }

      // ---------- Game ----------
      function renderGame() {
        const o = lastObs;
        if (!o) return;

        // フェーズラベル
        let phaseLabel = "—";
        if (o.bid_history && !o.declarer) phaseLabel = "ビッド中";
        else if (o.declarer !== null && !o.adjutant_card) phaseLabel = "副官指名待ち (declarer)";
        else if (o.visible_widow) phaseLabel = "場札交換 (declarer)";
        else if (o.completed && o.completed.length >= 0) phaseLabel = `プレイ中 (trick ${o.trick_index + 1})`;
        $("phase_label").textContent = phaseLabel;

        // 手札
        renderHand(o);

        // アクション UI
        renderActions(o);

        // 現在のトリック
        const trickHtml = (o.current_trick || [])
          .map((p) => `${p.seat}: ${cardLabel(p.card)}`)
          .join("  |  ");
        $("trick_area").textContent = `現在トリック: ${trickHtml || "(なし)"}`;
      }

      function renderHand(o) {
        const area = $("hand_area");
        area.innerHTML = "<h2>あなたの手札</h2>";
        const row = document.createElement("div");
        row.className = "row";
        for (const c of o.hand) {
          const b = document.createElement("button");
          b.className = `card suit-${c[0]}`;
          b.textContent = cardLabel(c);
          b.dataset.card = c;
          row.appendChild(b);
        }
        area.appendChild(row);
      }

      function renderActions(o) {
        const area = $("action_area");
        area.innerHTML = "";
        const myTurn = o.to_act === o.player;

        if (!myTurn) {
          area.innerHTML = `<p class="small">seat ${o.to_act} の番です</p>`;
          return;
        }

        // フェーズの推定: declarer が無ければ Bidding、ある + visible_widow があれば WidowExchange、
        // ある + adjutant_card 無し(自分が declarer)なら DeclareAdjutant、それ以外は Playing
        if (o.declarer === null) {
          renderBidActions();
        } else if (o.visible_widow) {
          renderWidowActions(o);
        } else if (o.adjutant_card === null && o.declarer === o.player) {
          renderAdjutantActions();
        } else {
          renderPlayActions(o);
        }
      }

      function renderBidActions() {
        const area = $("action_area");
        const passBtn = document.createElement("button");
        passBtn.textContent = "Pass";
        passBtn.onclick = () => submit({ type: "pass" });
        area.appendChild(passBtn);

        const tricks = document.createElement("select");
        for (let n = 13; n <= 20; n++) {
          const opt = document.createElement("option");
          opt.value = n;
          opt.textContent = `${n}枚`;
          tricks.appendChild(opt);
        }
        const trump = document.createElement("select");
        for (const t of TRUMPS) {
          const opt = document.createElement("option");
          opt.value = t;
          opt.textContent = SUIT_GLYPH[t] || t;
          trump.appendChild(opt);
        }
        const bidBtn = document.createElement("button");
        bidBtn.textContent = "宣言";
        bidBtn.onclick = () =>
          submit({
            type: "bid",
            payload: { tricks: parseInt(tricks.value, 10), trump: trump.value },
          });
        area.appendChild(tricks);
        area.appendChild(trump);
        area.appendChild(bidBtn);
      }

      function renderAdjutantActions() {
        const area = $("action_area");
        area.innerHTML += "<p>副官カードを指名:</p>";
        const select = document.createElement("select");
        for (const c of FULL_DECK) {
          const opt = document.createElement("option");
          opt.value = c;
          opt.textContent = cardLabel(c);
          select.appendChild(opt);
        }
        const btn = document.createElement("button");
        btn.textContent = "指名";
        btn.onclick = () =>
          submit({ type: "declare_adjutant", payload: { card: select.value } });
        area.appendChild(select);
        area.appendChild(btn);
      }

      function renderWidowActions(o) {
        const area = $("action_area");
        area.innerHTML += `<p>場札 ${o.visible_widow.map(cardLabel).join(" ")} を取り込み、捨てる2枚を選んでください:</p>`;
        const pool = [...o.hand, ...o.visible_widow];
        const selected = new Set();
        const row = document.createElement("div");
        row.className = "row";
        for (const c of pool) {
          const b = document.createElement("button");
          b.className = `card suit-${c[0]}`;
          b.textContent = cardLabel(c);
          b.onclick = () => {
            if (selected.has(c)) {
              selected.delete(c);
              b.classList.remove("selected");
            } else if (selected.size < 2) {
              selected.add(c);
              b.classList.add("selected");
            }
          };
          row.appendChild(b);
        }
        area.appendChild(row);
        const submitBtn = document.createElement("button");
        submitBtn.textContent = "捨て札を確定";
        submitBtn.onclick = () => {
          if (selected.size !== 2) {
            alert("2枚選んでください");
            return;
          }
          submit({
            type: "exchange_widow",
            payload: { discard: [...selected] },
          });
        };
        area.appendChild(submitBtn);
      }

      function renderPlayActions(o) {
        const area = $("action_area");
        area.innerHTML += "<p>カードを選択:</p>";
        const row = document.createElement("div");
        row.className = "row";
        for (const c of o.hand) {
          const b = document.createElement("button");
          b.className = `card suit-${c[0]}`;
          b.textContent = cardLabel(c);
          b.onclick = () => submit({ type: "play_card", payload: { card: c } });
          row.appendChild(b);
        }
        area.appendChild(row);
      }

      function submit(action) {
        send({ type: "submit_action", payload: { action } });
      }

      function renderEvent(ev) {
        switch (ev.type) {
          case "hand_started":
            log(`局開始 (hand ${ev.payload.hand_index}, first_bidder=seat ${ev.payload.first_bidder})`, "info");
            break;
          case "bidded":
            log(`seat ${ev.payload.seat} bid: ${ev.payload.bid.tricks} ${SUIT_GLYPH[ev.payload.bid.trump]}`);
            break;
          case "passed":
            log(`seat ${ev.payload.seat} pass`);
            break;
          case "napoleon_decided":
            log(`★ ナポレオン決定: seat ${ev.payload.seat}, ${ev.payload.bid.tricks} ${SUIT_GLYPH[ev.payload.bid.trump]}`, "info");
            break;
          case "adjutant_declared":
            log(`副官カード: ${cardLabel(ev.payload.card)}`);
            break;
          case "widow_exchanged":
            log(`場札交換 (公開絵札: ${ev.payload.revealed_face_cards.map(cardLabel).join(" ") || "なし"})`);
            break;
          case "card_played":
            log(`seat ${ev.payload.seat} → ${cardLabel(ev.payload.card)}`);
            break;
          case "adjutant_revealed":
            log(`★ 副官発覚: seat ${ev.payload.seat}`, "info");
            break;
          case "trick_won":
            log(`→ トリック取得: seat ${ev.payload.seat}`);
            break;
          case "hand_ended":
            log(`局終了 (event内 scores=${JSON.stringify(ev.payload.scores)})`);
            break;
          case "hand_redealt":
            log(`配り直し`, "info");
            break;
          case "hand_aborted":
            log(`★ 局中断(ホストが abort、scores 全0 で次局へ)`, "err");
            break;
        }
      }

      // ---------- Bindings ----------
      $("connect").onclick = connect;
      $("create").onclick = () => send({ type: "create_room" });
      $("join").onclick = () =>
        send({ type: "join_room", payload: { room_id: $("room_id_input").value.trim() } });
      $("leave_room").onclick = () => send({ type: "leave_room" });
      $("start_match").onclick = () => send({ type: "start_match" });
      $("next_hand").onclick = () => {
        send({ type: "next_hand" });
        $("next_hand").classList.add("hidden");
      };
      $("abort_hand").onclick = () => send({ type: "abort_hand" });
      $("end_match").onclick = () => send({ type: "end_match" });

      $("save_handle").onclick = () => {
        const newName = $("profile_handle").value.trim();
        if (!newName) {
          $("handle_status").textContent = "✗ 表示名は空にできません";
          $("handle_status").style.color = "#f88";
          return;
        }
        $("handle_status").textContent = "保存中…";
        $("handle_status").style.color = "#aaa";
        send({ type: "hello", payload: { display_name: newName } });
        // 楽観的更新: handle_taken エラーが来たら handleMessage 側で上書きされる
        myDisplayName = newName;
        setTimeout(() => {
          if ($("handle_status").textContent === "保存中…") {
            $("handle_status").textContent = "✓ 保存しました";
            $("handle_status").style.color = "#9c9";
            fetchUsers();
          }
        }, 200);
      };
      $("refresh_users").onclick = () => fetchUsers(false);
      $("refresh_games").onclick = () => fetchGames(false);
      $("refresh_stats").onclick = fetchStats;
      $("more_users").onclick = () => fetchUsers(true);
      $("more_games").onclick = () => fetchGames(true);

      // 30秒ごとに Ping
      setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) send({ type: "ping" });
      }, 30000);
    </script>
  </body>
</html>
