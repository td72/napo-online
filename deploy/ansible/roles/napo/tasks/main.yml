---
- name: Ensure system user / dirs / permissions
  ansible.builtin.import_tasks: system.yml

- name: Configure napo.env
  ansible.builtin.import_tasks: env.yml

- name: Install systemd service
  ansible.builtin.import_tasks: systemd.yml

- name: Install Caddy from Cloudsmith repo
  ansible.builtin.import_tasks: caddy_install.yml

- name: Configure Caddy reverse proxy
  ansible.builtin.import_tasks: caddy.yml

- name: Configure UFW firewall (CF IP allowlist on 80/443)
  ansible.builtin.import_tasks: firewall.yml

- name: Cleanup legacy artifacts
  ansible.builtin.import_tasks: cleanup.yml
