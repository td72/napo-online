---
- name: Ensure Caddy log dir exists
  ansible.builtin.file:
    path: /var/log/caddy
    state: directory
    owner: caddy
    group: caddy
    mode: "0755"

# Cloudflare Origin Certificate(cert + key)は VPS に手動配置する前提。
# ansible で配るとローカル ファイルの有無 = 冪等性が崩れるため。
# 期待配置: napo_tls_cert_path / napo_tls_key_path(README 参照)
- name: Verify Cloudflare Origin Certificate (cert)
  ansible.builtin.stat:
    path: "{{ napo_tls_cert_path }}"
  register: tls_cert_stat
  failed_when: not tls_cert_stat.stat.exists

- name: Verify Cloudflare Origin Certificate (key)
  ansible.builtin.stat:
    path: "{{ napo_tls_key_path }}"
  register: tls_key_stat
  failed_when: not tls_key_stat.stat.exists

- name: Render /etc/caddy/Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    owner: root
    group: root
    mode: "0644"
    backup: true
  notify: Reload caddy

- name: Ensure caddy service is enabled and running
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: started
