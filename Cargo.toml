[package]
name = "napo-online"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["ws", "macros"] }
dashmap = "6"
dotenvy = "0.15.7"
jsonwebtoken = "10.3.0"
napo-core = { path = "../napo-core", features = ["serde"] }
# v0.1.0 タグは napo-core 側に既にあるので、CI に SSH deploy key を設定すれば
# 以下に切替えてリリース可能(開発時は下の [patch] で path に戻す):
# napo-core = { git = "ssh://git@github.com/td72/napo-core.git", tag = "v0.1.0", features = ["serde"] }
rand = "0.10.1"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["trace", "compression-zstd", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ts-rs = "12.0.1"
uuid = { version = "1.23.1", features = ["v4", "serde"] }

[dev-dependencies]
futures-util = "0.3.32"
tokio-tungstenite = "0.29.0"

# napo-core を git+tag に切替えたとき、ローカル開発では path に差し替えるための雛形。
# 上の napo-core 行を git+tag に変えたら、ここを uncomment して有効化(docs §3.3):
# [patch."ssh://git@github.com/td72/napo-core.git"]
# napo-core = { path = "../napo-core" }
