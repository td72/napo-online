[package]
name = "napo-online"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
axum = { version = "0.8.9", features = ["ws", "macros"] }
dashmap = "6"
dotenvy = "0.15.7"
jsonwebtoken = { version = "10.3.0", features = ["rust_crypto"] }
napo-core = { git = "https://github.com/td72/napo-core.git", tag = "v0.2.1", features = ["serde"] }
rand = "0.10.1"
reqwest = { version = "0.13.3", default-features = false, features = ["json", "rustls"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
thiserror = "2.0.18"
tokio = { version = "1.52.2", features = ["full"] }
tower = "0.5.3"
tower-http = { version = "0.6.8", features = ["trace", "compression-zstd", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }
ts-rs = "12.0.1"
uuid = { version = "1.23.1", features = ["v4", "serde"] }

[dev-dependencies]
futures-util = "0.3.32"
tokio-tungstenite = "0.29.0"

# ローカル開発で napo-core を path 参照したい場合に有効化(uncomment):
# [patch."https://github.com/td72/napo-core.git"]
# napo-core = { path = "../napo-core" }
